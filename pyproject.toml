[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-lib-testkit"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = [
  "ipython>=9",
  "nest-asyncio>=1.6",
  "pillow>=11",
  "py-lib-runtime @ git+https://github.com/betabitplus/ternforge-tooling-py-runtime.git@v1.0.0",
  "pytest>=9",
  "rich>=14",
]
description = "Reusable Python library test helpers, configuration readers, and active-loop support."
readme = "README.md"
keywords = [ "library", "python" ]
license = "MIT"
authors = [ { name = "betabitplus", email = "8123085+betabitplus@users.noreply.github.com" } ]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
"Bug Tracker" = "https://github.com/betabitplus/ternforge-tooling-py-testkit/issues"
Documentation = "https://github.com/betabitplus/ternforge-tooling-py-testkit/tree/main/docs"
Homepage = "https://github.com/betabitplus/ternforge-tooling-py-testkit"
Repository = "https://github.com/betabitplus/ternforge-tooling-py-testkit"
[tool.hatch.metadata]
allow-direct-references = true

[tool.interrogate]
fail-under = 100
# Require docstrings in production code.
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
ignore-regex = [ "^wrapper$" ]
exclude = [ ".agents", ".artifact-smoke*", "docs", "scripts", "tests" ]
color = true
verbose = 1
quiet = false
omit-covered-files = true

# ---------------- Manifest validation ----------------

[tool.check-manifest]
ignore = [
  "*.egg-info/**",
  ".agents/**",
  ".copier-answers.yml",
  ".devcontainer/**",
  ".git/**",
  ".github/**",
  ".gitleaks.toml",
  ".markdown-link-check.json",
  ".markdownlint.yaml",
  ".mdformat.toml",
  ".pre-commit-config.yaml",
  ".pytest_cache/**",
  ".release-please-manifest.json",
  ".ruff_cache/**",
  ".venv/**",
  ".vscode/**",
  "__pycache__/**",
  "docs/**",
  "examples/**",
  "plan/**",
  "release-please-config.json",
  "scripts/**",
  "SETUP.md",
  "tests/**",
  "typos.toml",
  "uv.lock",
  "workbench/**",
]

# ---------------- Deptry (dependency hygiene) ----------------

[tool.deptry]
extend_exclude = [
  ".agents",
  ".artifact-smoke*",
  ".venv",
  "examples",
  "scripts",
  "tests",
  "workbench",
]
known_first_party = [ "py_lib_testkit" ]

# ---------------- Bandit (security) ----------------

[tool.bandit]
exclude_dirs = [ ".agents", ".venv", "scripts", "tests" ]

# ---------------- Pyright configuration ----------------

[tool.ty]
# Exclude patterns matching Pyright configuration.
src.exclude = [
  "**/__pycache__/",
  "*.egg-info/",
  ".agents/",
  ".artifact-smoke*/",
  ".devcontainer/",
  ".git/",
  ".github/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  ".vscode/",
  "scripts/",
  "tests/",
]
# ---------------- ty (Astral type checker) ----------------
environment.python-version = "3.13"
# Suppress rules that generate false positives or conflict with Pyright settings.
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.possibly-missing-attribute = "ignore"
rules.unknown-argument = "ignore"
rules.unresolved-attribute = "ignore"

[tool.coverage]
run.source = [ "src" ]
# ---------------- pytest coverage ----------------
report.fail_under = 1

# ---------------- Commitizen (conventional commits + changelog) ----------------

[tool.pip-audit]
# Ignore vulnerabilities that are not applicable or have no fix yet.
ignore-vulns = []

# ---------------- Import-linter architecture contracts ----------------

[tool.uv]
required-version = "==0.12.0"

[tool.pyright]
pythonVersion = "3.13"
venv = ".venv"
venvPath = "."
stubPath = "./.stubs"
typeCheckingMode = "basic"
# Exclude patterns.
exclude = [
  "**/__pycache__",
  "*.egg-info",
  ".agents",
  ".artifact-smoke*",
  ".devcontainer",
  ".git",
  ".github",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".vscode",
  # Utility and verification code are checked by Ruff/pytest instead.
  "scripts",
  "tests",
]
# Relaxed: third-party stubs and dynamic runtime APIs can report false positives.
reportArgumentType = false
reportAttributeAccessIssue = false
reportInconsistentOverload = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
reportOverlappingOverload = false
# Relaxed: tests may intentionally access private seams.
reportPrivateUsage = false
# Relaxed: dynamic library protocols can be stricter than runtime behavior.
reportReturnType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
# Relaxed: missing third-party stubs can flood unknown-type reports.
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
# Environment setup.
executionEnvironments = [ { root = "." } ]

[tool.pytest]
ini_options.pythonpath = [ ".", "src" ]  # Enable imports from project root and src/
ini_options.norecursedirs = [
  "*.egg-info",
  ".artifact-smoke*",
  ".git",
  ".hypothesis",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "scripts",
]
# ---------------- Pytest configuration ----------------
ini_options.addopts = "--cov --cov-report=term-missing"
ini_options.markers = [
  "e2e_behavior: end-to-end behavior tests",
  "e2e_contract: end-to-end public contract tests",
  "hermetic: marks tests that run fully offline",
  "slow: marks tests that are slow and should be skipped in fast runs",
  "vcr: marks tests that use VCR.py for HTTP recording/replay",
]

[tool.commitizen]
# Version management
name = "cz_conventional_commits"
allowed_prefixes = [ "Merge", "Revert", "WIP" ]
version_provider = "uv"
# Commit message settings
major_version_zero = true
tag_format = "v$version"
annotated_tag = true
# Changelog configuration
changelog_file = "CHANGELOG.md"
changelog_incremental = true
update_changelog_on_bump = true

# ---------------- Ternforge project manifest ----------------

[tool.importlinter]
root_packages = ["py_lib_testkit"]
include_external_packages = true

[dependency-groups]
dev = ["ruff>=0.15", "bandit>=1.9.4", "build>=1.5.0", "check-manifest>=0.51", "check-wheel-contents>=0.6.1", "commitizen>=4.16.3", "deptry>=0.25.1", "flake8>=7.3", "flake8-class-attributes-order>=0.3", "flake8-cognitive-complexity>=0.1", "hypothesis>=6.155.3", "import-linter>=2.11", "interrogate>=1.7", "ipykernel>=7.3.0", "ipython>=9.14.1", "nest-asyncio>=1.6", "pillow>=12.2", "pip-audit>=2.10.1", "pre-commit>=4.6.0", "pyright>=1.1.410", "pytest>=9.1.0", "pytest-cov>=7.1.0", "pytest-randomly>=4.1.0", "pytest-recording>=0.13.4", "pytest-xdist>=3.8.0", "radon>=6.0.1", "rich>=15", "syrupy>=5.3.2", "twine>=6.2.0", "ty>=0.0.50", "types-pillow>=10.2.0.20240822", "wheel>=0.47.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_lib_testkit"]

[tool.ternforge]
primary_package = "py_lib_testkit"
package_names = ["py_lib_testkit"]
library_lane = "standard-lib"
env_prefix = "PY_LIB_TESTKIT"
secrets.env_files = []

# ---------------- Pip Audit (dependency vulnerability scanning) ----------------

[tool.ruff]
target-version = "py313"
line-length = 88
