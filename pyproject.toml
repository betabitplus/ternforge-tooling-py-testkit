[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-lib-testkit"
version = "1.0.1"
requires-python = ">=3.13"
dependencies = [
  "ipython>=9",
  "nest-asyncio>=1.6",
  "pillow>=11",
  "py-lib-runtime @ git+https://github.com/betabitplus/ternforge-tooling-py-runtime.git@v1.0.0",
  "pytest>=9",
  "rich>=14",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_lib_testkit"]

[tool.ternforge]
primary_package = "py_lib_testkit"
package_names = ["py_lib_testkit"]
library_lane = "standard-lib"
env_prefix = "PY_LIB_TESTKIT"

[tool.ruff]
target-version = "py313"
line-length = 100
